name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm test` typechecks, builds, and runs the suite - including the stdio
      # conformance tests, which drive the built binary over a real MCP transport.
      - run: pnpm test
      - name: No runtime network access outside the indexer
        run: |
          if grep -rnE "\bfetch\(|node:http|node:https|undici|axios" src/ '--include=*.ts' \
             | grep -v '^src/indexer/'; then
            echo "::error::runtime network access found outside src/indexer/"
            exit 1
          fi
