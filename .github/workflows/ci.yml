name: ci

on:
  push:
    branches: [main]
  pull_request:
  # main's merge queue tests each entry on top of the latest main, and waits for the required test
  # check to report on it.
  merge_group:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # A release PR and another PR can wait in the queue together. The queue merges the other one, then
      # tests the release PR on top of it, and the suite passes, so the release PR would merge with a
      # version and changelog that miss what just merged. So a queue entry that changes the manifest
      # release-please bumps, which only a release PR does, has to come from a PR head built on the merge
      # group's base: release-please builds its PR as one commit on main's tip. The merge group's ref,
      # gh-readonly-queue/<branch>/pr-<number>-<base sha>, names the PR and the group's base, which has to
      # be the base the event names. The PR's head is read from refs/pull/<number>/head, which is its
      # current head, so the entry's tree has to be that head's: the queue's rebase of a one-commit PR onto
      # its own parent keeps the tree, and an entry built from an older head fails. The checkout and the
      # diff hold the entry commit, $GITHUB_SHA, from the runner. Every value is checked whole before git
      # reads it, and the fetches need no credentials, since the repository is public. It runs before
      # anything installs.
      - name: Keep a release PR older than main out of the queue
        if: ${{ github.event_name == 'merge_group' }}
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          [[ $BASE_SHA =~ ^[0-9a-f]{40}$ ]] || { echo "::error::The merge group names no base commit, so this check cannot tell whether a release PR is older than main."; exit 1; }
          git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA"
          status=0
          git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- .release-please-manifest.json || status=$?
          case $status in
            0) echo "This entry leaves .release-please-manifest.json as main has it, so it is no release PR."; exit 0 ;;
            1) ;;
            *) exit "$status" ;;
          esac
          if [[ ! $HEAD_REF =~ ^refs/heads/gh-readonly-queue/.+/pr-([0-9]+)-([0-9a-f]{40})$ ]]; then
            echo "::error::The merge group's ref names no pull request and base commit, so this check cannot tell whether the release PR is older than main."
            exit 1
          fi
          number="${BASH_REMATCH[1]}"
          if [[ ${BASH_REMATCH[2]} != "$BASE_SHA" ]]; then
            echo "::error::The merge group's ref names the base ${BASH_REMATCH[2]}, but its event names $BASE_SHA, so this check cannot tell whether the release PR is older than main."
            exit 1
          fi
          git fetch --quiet --no-tags --depth=2 origin "refs/pull/$number/head"
          parent="$(git rev-parse --verify FETCH_HEAD^)"
          if [[ $parent != "$BASE_SHA" ]]; then
            echo "::error::The release PR was built on $parent, not on $BASE_SHA, the commit this queue entry merges onto, so its version and changelog miss what lands on main before it. release-please rebuilds it on main's tip on the next push to main, and its auto-merge adds it to the queue again."
            exit 1
          fi
          entry_tree="$(git rev-parse --verify "$GITHUB_SHA^{tree}")"
          head_tree="$(git rev-parse --verify "FETCH_HEAD^{tree}")"
          if [[ $entry_tree != "$head_tree" ]]; then
            echo "::error::This queue entry does not match the release PR's current head, so it was built from an older head. The PR joins the queue again once release-please's update of it lands."
            exit 1
          fi
          echo "The release PR was built on $BASE_SHA, the commit this queue entry merges onto."
      # pnpm/setup caches the pnpm store. This setup-node caches by itself whenever
      # package.json names a packageManager, so it is switched off by name.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      # Installs the pnpm that `packageManager` names, then runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: true
          require-lockfile: true
          cache: true
      # `pnpm test` typechecks, builds, and runs the suite - including the stdio
      # conformance tests, which drive the built binary over a real MCP transport.
      - run: pnpm test
