name: release

on:
  push:
    branches: [main]
  # Lets the MCP registry publish be retried for a tag npm already has, without
  # running the npm publish again.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to the MCP registry
        required: true

permissions:
  contents: read

# Release runs never overlap, and one in progress is never cancelled, because a cancelled
# run can leave a tag with nothing published.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max  # the release PR merge's own run must not be replaced while it waits

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.publish.outputs.released }}  # 'true' once npm accepted the publish, else empty
      tag: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write       # create tags and releases
      pull-requests: write  # open and groom the release PR
      issues: write         # create and apply the release PR labels
      id-token: write       # OIDC for trusted publishing
    steps:
      # A dispatch only retries the MCP registry publish, so it must not release. release-please
      # does not check which event started the run. From a dispatch it would release a merged
      # release PR to npm, while the registry job published the dispatched tag instead.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        if: ${{ github.event_name == 'push' }}
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below runs only on the merge of the release PR, and only in a run triggered
      # at the tagged commit, because npm provenance names the commit that triggered the run.
      # The two exceptions are the first two steps, which never build or publish and only fail
      # a run. The first fails a run triggered anywhere else, so a release that could not be
      # published shows up as a red run.
      - name: Release tagged at another commit, not published
        if: ${{ steps.release.outputs.release_created && steps.release.outputs.sha != github.sha }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          TAGGED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          echo "::error::$TAG was tagged at $TAGGED_SHA but this run was triggered at $GITHUB_SHA, so nothing was published and npm has nothing for $TAG."
          exit 1
      # The second fails a push run that created no release while a merged release PR still
      # carries autorelease: pending. release-please moves that label to autorelease: tagged
      # right after it creates the release, so it has not finished releasing that PR, and the
      # run would otherwise end green. The query reads the pull requests directly, because gh
      # pr list --label goes through search, and search lags behind a relabel. An answer the
      # step cannot read fails the run too.
      - name: Check that every merged release PR was released
        if: ${{ github.event_name == 'push' && !steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { pullRequests(states: MERGED, labels: ["autorelease: pending"], first: 100) { totalCount nodes { number } } } }'
          if ! response="$(gh api graphql -f query="$query" -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY#*/}")" ||
            ! jq -se 'length == 1 and .[0].errors == null and (.[0].data.repository.pullRequests.totalCount | type) == "number"' <<< "$response" > /dev/null; then
            echo "::error::Could not read the merged release PRs that carry autorelease: pending, so this run cannot tell whether release-please left one unreleased."
            exit 1
          fi
          if ! jq -e '.data.repository.pullRequests.totalCount == 0' <<< "$response" > /dev/null; then
            echo "::error::These merged release PRs still carry autorelease: pending, so release-please has not released them: $(jq -r '[.data.repository.pullRequests.nodes[].number | "#\(.)"] | join(", ")' <<< "$response"). Follow \"A merged release PR with no release\" in docs/RELEASING.md."
            exit 1
          fi
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        if: ${{ steps.release.outputs.release_created && steps.release.outputs.sha == github.sha }}
        with:
          ref: ${{ steps.release.outputs.sha }}  # the tagged commit, not the run's trigger
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        if: ${{ steps.release.outputs.release_created && steps.release.outputs.sha == github.sha }}
        with:
          node-version: '26'
          # No dependency cache in the job that publishes. This setup-node restores one by
          # itself whenever package.json names a packageManager, so it is switched off by name.
          package-manager-cache: false
      # setup-node pins the npm bundled with the Node release; trusted publishing needs
      # >= 11.5.1. Pinned exactly, not @latest: this job holds id-token: write, and a
      # floating install is the one unpinned thing in a workflow whose constraints
      # demand pins everywhere.
      - run: npm install -g npm@12.0.2
        if: ${{ steps.release.outputs.release_created && steps.release.outputs.sha == github.sha }}
      # Installs the pnpm that `packageManager` names, then runs `pnpm install --frozen-lockfile`.
      # It leaves the pnpm store uncached. It caches its lockfile-verification record whatever the
      # inputs say, and saves the record right after the install. When that save does not go
      # through, its post step tries again at the end of the job.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b  # v2.1.0
        if: ${{ steps.release.outputs.release_created && steps.release.outputs.sha == github.sha }}
        with:
          install: true
          require-lockfile: true
      - run: pnpm test
        if: ${{ steps.release.outputs.release_created && steps.release.outputs.sha == github.sha }}
      - id: publish
        if: ${{ steps.release.outputs.release_created && steps.release.outputs.sha == github.sha }}
        run: |
          npm publish
          echo "released=true" >> "$GITHUB_OUTPUT"

  # A job of its own, because a job gets an environment's secrets only by naming the
  # environment, and naming one puts an environment claim in that job's OIDC token. npm's
  # trusted publisher is registered with no environment, so the release job must not name one.
  registry:
    needs: release
    # A dispatch releases nothing, so it runs this job on its own condition.
    if: ${{ needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: mcp-registry
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag to publish must look like v1.2.3."
            exit 1
          fi
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # Compared inside jq, because command substitution would drop a trailing newline.
      - name: Check that server.json carries the tag's version
        run: |
          if ! jq -e --arg version "${TAG#v}" '.version == $version and .packages[0].version == $version' server.json > /dev/null; then
            echo "::error::server.json must carry ${TAG#v} as both .version and .packages[0].version."
            exit 1
          fi
      # The sha256 was taken from the release asset when the pin was set, and it matched
      # registry_1.8.1_checksums.txt. A checksums file fetched from the same release at run time
      # proves nothing the download does not. Moving the pin means a new URL and a new sha256.
      - name: Install mcp-publisher 1.8.1
        run: |
          curl -fsSL -o mcp-publisher_linux_amd64.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      # The registry reads the version from npm once, with no retry, and npm has taken about
      # 5 minutes to serve a new one. This polls the URL the registry reads, with the slash
      # escaped as the registry escapes it. It waits before the login, because the login's
      # token lasts 5 minutes and the publish never renews it. A version npm already serves,
      # as on a dispatch, passes on the first try.
      - name: Wait for npm to serve the tag's version
        run: |
          url="https://registry.npmjs.org/@tibia.sh%2Ftibiawiki-mcp/${TAG#v}"
          for _ in $(seq 40); do
            if status="$(curl -fsS --max-time 10 -o npm-version.json -w '%{http_code}' "$url")" && [ "$status" = 200 ] &&
              jq -e --arg version "${TAG#v}" '.version == $version and .mcpName == "sh.tibia/tibiawiki-mcp"' npm-version.json > /dev/null; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::npm did not serve @tibia.sh/tibiawiki-mcp@${TAG#v} with mcpName sh.tibia/tibiawiki-mcp in 40 tries, 15 seconds apart. Follow \"A version the MCP registry does not have\" in docs/RELEASING.md."
          exit 1
      - name: Log in to the MCP registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain tibia.sh --private-key "$MCP_PRIVATE_KEY"
      - name: Publish to the MCP registry
        run: ./mcp-publisher publish
